codebuddy:
  api_endpoint: https://copilot.tencent.com
  allowed_endpoints: https://copilot.tencent.com,https://www.codebuddy.ai
  models: "glm-5.2,deepseek-v4-pro"
  forced_temperature: "1"          # 空 = 保留客户端值
  rotation_count: 1                # 每 N 次请求切换凭证
  auto_checkin_enabled: true
  checkin_hour: 9
  checkin_minute: 30
  background_delay_min_seconds: 5
  background_delay_max_seconds: 20
  cli_version: "2.107.0"
  models_cache_ttl_seconds: 30
  admin_username: admin
  admin_password: admin123         # 仅用于首启动建户
trae:
  callback_port: 18080             # TRAE 登录回调监听端口（本机部署用自动捕获，远程用粘贴导入）
log:
  log_level: debug
  mode: both               #  file or console or both
  encoding: console           # json or console
  log_file_name: "./storage/logs/server.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true